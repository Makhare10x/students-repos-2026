<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- import main header using js -->
    <div id="header-placeholder"></div>
    <main>
      <!-- import sidebar using js -->
      <div id="sidebar-placeholder"></div>
      <section class="disvover-nav">
        <nav class="content-filter always-show">
          <ul>
            <li><a href="./discover.html">Music</a></li>
            <li><a href="#LinkinPark">EDM</a></li>
            <li><a href="#GetLucky">Indie</a></li>
          </ul>
        </nav>
      </section>
      <section class="main-poster">
        <article id="LinkinPark">
          <img src="./assets/discover_img/image 20.png" alt="Linkin Park" />
          <div class="linkin-park">
            <img
              src="./assets/discover_img/image 7 (1).png"
              alt="Linkin Park Mix"
            />
            <div class="playlist-header-content">
              <h3>Linkin Park Mix</h3>
              <div class="playlist-metadata">
                <span class="author">By <strong>Spotify</strong></span>
                <span class="divider">•</span>
                <span class="year">2023</span>
                <span class="divider">•</span>
                <span class="song-count">22 songs</span>
                <span class="divider">•</span>
                <span class="duration">1 hr 14 min</span>
              </div>
              <div class="playlist-actions">
                <img
                  src="./assets/discover_img/icons big (23).png"
                  alt="Play"
                />
                <img
                  src="./assets/discover_img/icons big (17).png"
                  alt="Save to library"
                />
                <span>500K</span>
                <img
                  src="./assets/discover_img/icons big (18).png"
                  alt="Add to playlist"
                />
                <img src="./assets/discover_img/icons big (20).png" alt="Add" />
                <img
                  src="./assets/discover_img/icons big (21).png"
                  alt="Share"
                />
                <img
                  src="./assets/discover_img/icons big (22).png"
                  alt="More options"
                />
              </div>
              <div class="genre-container">
                <span class="genre-tag">Rock</span>
                <span class="genre-tag">Alt Rock</span>
              </div>
            </div>
          </div>
        </article>

        <article id="GetLucky">
          <img src="./assets/discover_img/image 21.png" alt="Get Lucky" />
          <div class="linkin-park">
            <img src="./assets/discover_img/image 15.png" alt="Get Lucky Mix" />
            <div class="playlist-header-content">
              <h3>Get Lucky Mix</h3>
              <div class="playlist-metadata">
                <span class="author">By <strong>Daft Punk</strong></span>
                <span class="divider">•</span>
                <span class="year">2013</span>
                <span class="divider">•</span>
                <span class="duration">6:05</span>
              </div>
              <div class="playlist-actions">
                <img
                  src="./assets/discover_img/icons big (23).png"
                  alt="Play"
                />
                <img
                  src="./assets/discover_img/icons big (17).png"
                  alt="Save to library"
                />
                <span>500K</span>
                <img
                  src="./assets/discover_img/icons big (18).png"
                  alt="Add to playlist"
                />
                <img src="./assets/discover_img/icons big (20).png" alt="Add" />
                <img
                  src="./assets/discover_img/icons big (21).png"
                  alt="Share"
                />
                <img
                  src="./assets/discover_img/icons big (22).png"
                  alt="More options"
                />
              </div>
              <div class="genre-container">
                <span class="genre-tag">Rock</span>
                <span class="genre-tag">Alt Rock</span>
              </div>
            </div>
          </div>
        </article>
      </section>
    </main>
    <div id="footer-placeholder"></div>

    <script src="./app.js"></script>
  </body>
</html>
